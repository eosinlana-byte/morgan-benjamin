<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Morgan admin</title>
  <link rel="stylesheet" href="/admin.css" />
</head>
<body>
  <div id="login">
    <h1>Morgan</h1>
    <input id="user" placeholder="Username" />
    <input id="pass" type="password" placeholder="Password" />
    <button id="go">Enter</button>
    <p id="lerr"></p>
  </div>
  <div id="dash" hidden>
    <header>
      <strong>MORGAN</strong>
      <nav>
        <button data-tab="tracks">Tracks</button>
        <button data-tab="works">Work</button>
        <button data-tab="notes">Notes</button>
        <button data-tab="enquiries">Messages</button>
        <button data-tab="settings">Settings</button>
      </nav>
      <button id="out">Out</button>
    </header>
    <main>
      <section id="tracks" class="tab"></section>
      <section id="works" class="tab" hidden></section>
      <section id="notes" class="tab" hidden></section>
      <section id="enquiries" class="tab" hidden></section>
      <section id="settings" class="tab" hidden></section>
    </main>
  </div>
  <script src="/admin.js"></script>
</body>
</html>
