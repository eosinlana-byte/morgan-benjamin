<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Morgan Benjamin Admin</title><style>:root{--bg:#101010;--card:#181818;--gold:#d4af37;--text:#f5ebdd;--muted:#b9b0a2;--line:#38332b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Arial}.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:#080808;padding:25px 15px;display:flex;flex-direction:column;gap:7px}.side strong{font-size:18px;padding:0 10px 25px}.side button{background:transparent;color:var(--muted);border:0;text-align:left;padding:12px;cursor:pointer}.side button.active,.side button:hover{background:#272218;color:var(--gold)}.logout{margin-top:auto}.main{padding:32px;max-width:1200px;width:100%}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}h1{margin:0}.gold{background:var(--gold);color:#101010;border:0;padding:11px 15px;font-weight:bold;cursor:pointer}.danger{background:#8e3838;color:#fff}.table{overflow:auto}table{width:100%;border-collapse:collapse;background:var(--card)}th,td{padding:14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--gold);font-size:11px;text-transform:uppercase}td{color:var(--muted)}a{color:var(--gold)}.hidden{display:none!important}.modal{position:fixed;inset:0;display:none;place-items:center;padding:20px}.modal.open{display:grid}.shade{position:absolute;inset:0;background:#000b}.form{position:relative;background:var(--card);border:1px solid var(--gold);padding:25px;width:min(500px,100%)}label{display:grid;gap:7px;margin:14px 0}input,textarea{padding:11px;background:#101010;color:var(--text);border:1px solid #555;font:inherit;width:100%}.actions{display:flex;gap:8px;margin-top:18px}@media(max-width:700px){.app{display:block}.side{flex-direction:row;flex-wrap:wrap}.side strong{width:100%}.logout{margin-top:0;margin-left:auto}.main{padding:20px}}
</style></head><body><div class="app"><aside class="side"><strong>MORGAN BENJAMIN</strong><button class="tab active" data-tab="releases">Music</button><button class="tab" data-tab="services">Services</button><button class="tab" data-tab="testimonials">Testimonials</button><button class="tab" data-tab="messages">Enquiries</button><form class="logout" method="post" action="/admin/logout"><button>Log out</button></form></aside><main class="main"><section id="releases"><div class="top"><h1>Music</h1><button class="gold add" data-kind="releases">Add song</button></div><div class="table"><table><thead><tr><th>Title</th><th>Type</th><th>Year</th><th>Artwork</th><th>Actions</th></tr></thead><tbody></tbody></table></div></section><section id="services" class="hidden"><div class="top"><h1>Services</h1><button class="gold add" data-kind="services">Add service</button></div><div class="table"><table><thead><tr><th>Title</th><th>Description</th><th>Actions</th></tr></thead><tbody></tbody></table></div></section><section id="testimonials" class="hidden"><div class="top"><h1>Testimonials</h1><button class="gold add" data-kind="testimonials">Add testimonial</button></div><div class="table"><table><thead><tr><th>Client</th><th>Image</th><th>Actions</th></tr></thead><tbody></tbody></table></div></section><section id="messages" class="hidden"><div class="top"><h1>Enquiries</h1></div><div class="table"><table><thead><tr><th>Date</th><th>Name</th><th>Email</th><th>Subject</th><th>Message</th></tr></thead><tbody></tbody></table></div></section></main></div><div class="modal"><div class="shade"></div><form class="form"><h2></h2><div class="fields"></div><div class="actions"><button class="gold">Save</button><button type="button" class="cancel">Cancel</button></div></form></div><script>const state={releases:[],services:[],testimonials:[],messages:[]};const modal=document.querySelector('.modal'),form=document.querySelector('.form');let editing=null;const fields={releases:[['title','Title'],['kind','Type'],['year','Year'],['image','Artwork image URL']],services:[['title','Title'],['description','Description']],testimonials:[['client','Client'],['image','Testimonial image URL']]};async function api(u,o={}){const r=await fetch(u,{headers:{'Content-Type':'application/json'},...o});return r.json()}async function load(){Object.assign(state,await api('/api/admin/content'));render()}function render(){for(const k of ['releases','services','testimonials','messages']){const sec=document.getElementById(k);if(!sec)continue;const tb=sec.querySelector('tbody');const rows=state[k]||[];tb.innerHTML=rows.map(x=>{if(k==='messages')return`<tr><td>${new Date(x.created_at).toLocaleString()}</td><td>${x.name}</td><td><a href="mailto:${x.email}">${x.email}</a></td><td>${x.subject||''}</td><td>${x.message}</td></tr>`;return k==='releases'?`<tr><td>${x.title}</td><td>${x.kind||''}</td><td>${x.year||''}</td><td>${x.image?'Added':''}</td><td><button class="gold edit" data-k="${k}" data-id="${x.id}">Edit</button> <button class="gold danger del" data-k="${k}" data-id="${x.id}">Delete</button></td></tr>`:k==='services'?`<tr><td>${x.title}</td><td>${x.description}</td><td><button class="gold edit" data-k="${k}" data-id="${x.id}">Edit</button> <button class="gold danger del" data-k="${k}" data-id="${x.id}">Delete</button></td></tr>`:`<tr><td>${x.client}</td><td>${x.image?'Added':''}</td><td><button class="gold edit" data-k="${k}" data-id="${x.id}">Edit</button> <button class="gold danger del" data-k="${k}" data-id="${x.id}">Delete</button></td></tr>`}).join('')||'<tr><td colspan="5">Nothing added yet.</td></tr>'}}function openForm(k,item={}){editing=item.id||null;form.querySelector('h2').textContent=editing?'Edit '+k:'Add '+k;form.dataset.kind=k;form.querySelector('.fields').innerHTML=fields[k].map(([n,l])=>`<label>${l}<input name="${n}" value="${item[n]||''}" required></label>`).join('');modal.classList.add('open')}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('main section').forEach(x=>x.classList.toggle('hidden',x.id!==b.dataset.tab))});document.querySelectorAll('.add').forEach(b=>b.onclick=()=>openForm(b.dataset.kind));document.querySelector('.cancel').onclick=()=>modal.classList.remove('open');document.querySelector('.shade').onclick=()=>modal.classList.remove('open');document.addEventListener('click',async e=>{if(e.target.classList.contains('edit')){const x=state[e.target.dataset.k].find(x=>x.id==e.target.dataset.id);openForm(e.target.dataset.k,x)}if(e.target.classList.contains('del')){if(confirm('Delete this item?')){await api('/api/admin/'+e.target.dataset.k+'/'+e.target.dataset.id,{method:'DELETE'});load()}}});form.onsubmit=async e=>{e.preventDefault();const k=form.dataset.kind;const body=Object.fromEntries(new FormData(form));await api('/api/admin/'+k+(editing?'/'+editing:''),{method:editing?'PUT':'POST',body:JSON.stringify(body)});modal.classList.remove('open');load()};load();</script></body></html>
